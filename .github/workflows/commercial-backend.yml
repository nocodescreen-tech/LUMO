name: Commercial backend validation
on:
  push:
    branches: [commercial-v2]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumo_test
          POSTGRES_PASSWORD: lumo_test_only
          POSTGRES_DB: lumo_commercial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: lumo_test
      DB_PASSWORD: lumo_test_only
      DB_NAME_TEST: lumo_commercial_test
      JWT_SECRET: test-only-local-ci-not-for-production
      LUMO_RUN_INTEGRATION: '1'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: find controllers middleware routes models utils migrations -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm test -- --runInBand tests/transactionSafety.unit.test.js
      - run: npm test -- --runInBand tests/commercial.integration.test.js
