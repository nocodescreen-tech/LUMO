name: LUMO CI/CD (Production Ready)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
        
    - name: Backend - Install & Test
      run: |
        cd server
        npm install
        # npm test # To enable when test DB is ready in CI
        
    - name: Frontend - Install & Build
      run: |
        cd client
        npm ci --legacy-peer-deps
        npm run build

  docker-validation:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Build Backend Image (Dry Run)
      uses: docker/build-push-action@v4
      with:
        context: ./server
        push: false
        tags: lumo-erp-server:latest
        
    - name: Build Frontend Image (Dry Run)
      uses: docker/build-push-action@v4
      with:
        context: ./client
        push: false
        tags: lumo-erp-client:latest
