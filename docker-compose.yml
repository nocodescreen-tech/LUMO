version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lumo-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nocode
      POSTGRES_DB: hubcommerce_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lumo-redis
    restart: always
    ports:
      - "6379:6379"

  server:
    build: ./server
    container_name: lumo-backend
    ports:
      - "5001:5001"
    env_file:
      - ./server/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - NODE_ENV=production
    volumes:
      - ./server/logs:/app/logs
      - ./server/backups:/app/backups
    depends_on:
      - db
      - redis

  client:
    build: ./client
    container_name: lumo-frontend
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  pgdata:
